<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>의견 조사 결과 | Workbench</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css?v=20261020c"><link rel="stylesheet" href="/assets/css/admin.css?v=20261109b"><link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
.table td{font-size:13.5px;vertical-align:top}.tiny{font-size:12px;color:var(--ink-3)}
.wrap{overflow-x:auto}.noperm{padding:60px 20px;text-align:center;color:var(--ink-3)}
.bar{display:flex;align-items:center;gap:10px}.bar .b{height:14px;background:var(--navy-800);min-width:2px}.bar .b.q2{background:var(--gold-400)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media (max-width:1000px){.two{grid-template-columns:1fr}}
.link{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.link input{flex:1;min-width:260px;font:13px var(--mono);padding:9px 10px;border:1px solid var(--line-2)}
.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.st{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px}.st.on{background:#E3F1EA;color:var(--success)}.st.off{background:#F8E3E0;color:var(--danger)}
</style>
</head>
<body>
<div class="admin-shell">
  <div id="admin-side"></div>
  <main class="admin-main">
    <div class="admin-top"><div><span class="eyebrow" style="margin-bottom:6px">Event 2027 · Poll</span><h1 id="ttl">의견 조사 결과</h1><div class="sub">링크를 받은 준비위원·학번대표가 로그인 없이 응답합니다. 한 사람(이름+학번) 한 표이고, 다시 내면 앞의 응답이 바뀝니다. 결과는 선호도 참고용입니다.</div></div>
      <div class="actions"><a class="btn sm ghost" href="/admin/event2027/">창립총회</a></div></div>
    <div class="admin-body" id="body">
      <div class="kpi">
        <div class="k gold"><div class="v" id="k-n">—</div><div class="l">응답</div></div>
        <div class="k"><div class="v" id="k-c">—</div><div class="l">준비위원 / 학번대표</div></div>
        <div class="k"><div class="v" id="k-top">—</div><div class="l">1순위 최다</div></div>
        <div class="k"><div class="v" id="k-st">—</div><div class="l">상태</div></div>
      </div>
      <div class="panel"><div class="panel-head"><h2>응답 링크</h2><button class="btn sm ghost" id="toggle">마감하기</button></div>
        <div class="link"><input id="url" readonly><button class="btn sm" id="copy">링크 복사</button><a class="btn sm ghost" id="open" target="_blank" rel="noopener">응답 화면 열기</a></div>
        <p class="tiny" style="margin:8px 0 0">이 링크를 카톡방에 그대로 올리면 됩니다. 링크 끝의 열쇠 값이 없으면 열리지 않습니다.</p></div>
      <div class="two">
        <div class="panel"><div class="panel-head"><h2>연사 선호</h2><span class="tiny">점수 = 1순위 2점 + 2순위 1점</span></div><div class="wrap"><table class="table" id="t-pick"></table></div></div>
        <div class="panel"><div class="panel-head"><h2>선호 형식</h2></div><div class="wrap"><table class="table" id="t-fmt"></table></div></div>
      </div>
      <div class="panel"><div class="panel-head"><h2>응답 목록 · 자유 의견</h2><span class="tiny" id="n2"></span></div><div class="wrap"><table class="table" id="t-all"></table></div></div>
    </div>
  </main>
</div>
<script src="/assets/js/site.js?v=20261116b"></script><script src="/assets/js/admin.js?v=20261116b"></script>
<script>
(async () => {
  const esc = SNU.esc, { api, toast } = WB, q = s => document.querySelector(s), id = new URLSearchParams(location.search).get('id') || 'keynote';
  let D;
  async function load() { try { D = await api('/poll?id=' + encodeURIComponent(id) + '&r=results'); } catch (e) { q('#body').innerHTML = `<div class="noperm">${esc(e.message)}</div>`; return; } render(); }
  function render() {
    const P = D.poll, B = P.body, C = B.candidates || [], V = D.votes, Q = B.questions || [];
    const q1 = Q.find(x => x.type === 'pick' && x.required), q2 = Q.find(x => x.type === 'pick' && !x.required), q3 = Q.find(x => x.type === 'choice'), q4 = Q.find(x => x.type === 'text');
    q('#ttl').textContent = P.title + ' — 결과';
    const link = `${location.origin}/poll/?id=${P.id}&k=${P.token}`; q('#url').value = link; q('#open').href = link;
    q('#k-n').textContent = V.length; q('#k-c').textContent = `${V.filter(v => v.role === '준비위원').length} / ${V.filter(v => v.role === '학번대표').length}`;
    q('#k-st').innerHTML = P.open ? '<span class="st on">받는 중</span>' : '<span class="st off">마감</span>'; q('#toggle').textContent = P.open ? '마감하기' : '다시 열기';
    const nm = no => (C.find(c => c.no === no) || {}).name || no;
    const rows = C.map(c => { const a = V.filter(v => q1 && v.answers[q1.id] === c.no).length, b = V.filter(v => q2 && v.answers[q2.id] === c.no).length; return { c, a, b, s: a * 2 + b }; }).sort((x, y) => y.s - x.s || y.a - x.a);
    const max = Math.max(1, ...rows.map(r => r.s));
    q('#k-top').textContent = rows[0] && rows[0].a ? rows.filter(r => r.a === Math.max(...rows.map(x => x.a))).map(r => r.c.name).join(', ') : '—';
    q('#t-pick').innerHTML = `<thead><tr><th>연사</th><th class="amt">1순위</th><th class="amt">2순위</th><th class="amt">점수</th><th style="width:40%"></th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.c.no)} <b>${esc(r.c.name)}</b></td><td class="amt">${r.a}</td><td class="amt">${r.b}</td><td class="amt"><b>${r.s}</b></td><td><div class="bar"><div class="b" style="width:${r.a * 2 / max * 100}%"></div><div class="b q2" style="width:${r.b / max * 100}%;margin-left:-10px"></div></div></td></tr>`).join('')}</tbody>`;
    q('#t-fmt').innerHTML = q3 ? `<thead><tr><th>형식</th><th class="amt">응답</th></tr></thead><tbody>${q3.options.map(o => `<tr><td>${esc(o)}</td><td class="amt">${V.filter(v => v.answers[q3.id] === o).length}</td></tr>`).join('')}</tbody>` : '';
    q('#n2').textContent = V.length + '명';
    const day = s => String(s || '').replace('T', ' ').slice(5, 16);
    q('#t-all').innerHTML = `<thead><tr><th>이름</th><th>학번</th><th>구분</th><th>1순위</th><th>2순위</th><th>형식</th><th>자유 의견</th><th>응답 시각(UTC)</th><th></th></tr></thead><tbody>${V.map(v => `<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.cohort)}</td><td>${esc(v.role)}</td><td>${q1 ? esc(nm(v.answers[q1.id])) : ''}</td><td>${q2 && v.answers[q2.id] ? esc(nm(v.answers[q2.id])) : ''}</td><td class="tiny">${q3 ? esc(v.answers[q3.id] || '') : ''}</td><td style="white-space:pre-wrap;max-width:360px">${q4 ? esc(v.answers[q4.id] || '') : ''}</td><td class="tiny">${day(v.updated_at)}</td><td><button class="btn sm ghost" data-del="${esc(v.voter)}" title="이 응답 지우기">×</button></td></tr>`).join('') || '<tr><td colspan="9" class="muted">아직 응답이 없습니다.</td></tr>'}</tbody>`;
  }
  q('#t-all').addEventListener('click', async e => { const b = e.target.closest('[data-del]'); if (!b || !confirm('이 응답을 지울까요?')) return; await api('/poll', { method: 'POST', body: { r: 'delvote', id, voter: b.dataset.del } }); load(); });
  q('#copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(q('#url').value); toast('링크를 복사했습니다'); } catch (e) { q('#url').select(); } });
  q('#toggle').addEventListener('click', async () => { if (!confirm(D.poll.open ? '응답을 마감할까요?' : '다시 열까요?')) return; await api('/poll', { method: 'POST', body: { r: 'open', id, open: !D.poll.open } }); load(); });
  load(); setInterval(() => document.visibilityState === 'visible' && load(), 30000);
})();
</script>
</body></html>
