<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>결산 보고 발표 | Workbench</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
:root{--navy:#0F2340;--navy-2:#1B3560;--gold:#B8955A;--gold-2:#D8C29A;--ivory:#F7F3EC;--paper:#FFFFFF;--ink:#1D232C;--ink-2:#4A5361;--ink-3:#7A8392;--line:#E4DED3;--neg:#8A3B2E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0B1830;color:var(--ink);font-family:'Noto Sans KR',sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.deck{position:relative;width:1600px;height:900px;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--paper);display:none;flex-direction:column;padding:72px 96px 64px;overflow:hidden}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--navy) 0,var(--navy-2) 60%,var(--gold) 100%)}
.kicker{font-family:'Cormorant Garamond',serif;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-size:20px;font-weight:600;margin-bottom:10px}
h2{font-family:'Noto Serif KR',serif;font-weight:600;font-size:46px;color:var(--navy);letter-spacing:-.01em;line-height:1.25}
h2 small{font-size:24px;color:var(--ink-3);font-weight:400;margin-left:14px}
.rule{width:64px;height:3px;background:var(--gold);margin:22px 0 36px}
.foot{position:absolute;left:96px;right:96px;bottom:30px;display:flex;justify-content:space-between;font-size:15px;color:var(--ink-3);letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.neg{color:var(--neg)}
/* cover */
.cover{background:var(--navy);color:#fff;justify-content:center;padding:0 140px}
.cover::after{background:var(--gold)}
.cover .kicker{color:var(--gold-2);font-size:22px}
.cover h1{font-family:'Noto Serif KR',serif;font-weight:600;font-size:76px;line-height:1.2;letter-spacing:-.01em}
.cover .org{font-size:28px;color:var(--gold-2);margin-top:28px;font-family:'Noto Serif KR',serif}
.cover .meta{margin-top:56px;display:flex;gap:56px;font-size:20px;color:#C9D2E0}
.cover .meta b{display:block;color:#fff;font-size:26px;font-weight:500;margin-top:6px}
/* summary */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--navy);border-bottom:1px solid var(--line)}
.kpi{padding:30px 28px 32px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0;background:var(--ivory)}
.kpi .l{font-size:19px;color:var(--ink-2);margin-bottom:14px}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:56px;font-weight:600;color:var(--navy);line-height:1}
.kpi .v .u{font-family:'Noto Sans KR';font-size:20px;color:var(--ink-3);margin-left:6px;font-weight:400}
.kpi .s{font-size:16px;color:var(--ink-3);margin-top:12px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:64px;margin-top:44px;flex:1;min-height:0}
.block h3{font-family:'Noto Serif KR',serif;font-size:24px;color:var(--navy);font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline}
.block h3 span{font-family:'Noto Sans KR';font-size:16px;color:var(--ink-3);font-weight:400}
.bars .row{display:grid;grid-template-columns:220px 1fr 170px;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:19px}
.bars .bar{height:12px;background:var(--ivory)}
.bars .bar i{display:block;height:100%;background:var(--navy-2)}
.bars .bar i.g{background:var(--gold)}
.bars .a{text-align:right}
/* statement */
.stmt{width:100%;border-collapse:collapse;font-size:21px}
.stmt td{padding:7px 18px;border-bottom:1px solid var(--line)}
.stmt td:last-child{text-align:right;width:300px}
.stmt td.n{font-size:16px;color:var(--ink-3);width:auto;text-align:left}
.stmt tr.h td{font-weight:700;color:var(--navy);background:var(--ivory)}
.stmt tr.s td:first-child{padding-left:52px;color:var(--ink-2)}
.stmt tr.end td{font-weight:700;background:var(--navy);color:#fff;border:0}
.stmt tr.end td.n{color:#C9D2E0}
/* donors */
.tiers{display:flex;flex-direction:column;gap:0;border-top:2px solid var(--navy);flex:1;min-height:0}
.tier{display:grid;grid-template-columns:170px 1fr;gap:28px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.tier .amt{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--gold);font-size:27px;text-align:right;white-space:nowrap}
.tier .amt .u{font-family:'Noto Sans KR';font-size:16px;color:var(--ink-3);margin-left:3px;font-weight:400}
.tier .ppl{display:flex;flex-wrap:wrap;gap:2px 22px;font-size:20px;line-height:1.5}
.tier .ppl span{white-space:nowrap}
.tier .ppl em{font-style:normal;color:var(--ink-3);font-size:.78em;margin-left:5px}
.dense .tier{padding:9px 0}
.dense .tier .ppl{font-size:16.5px;gap:2px 16px;line-height:1.5}
.dense .tier .amt{font-size:26px}
.thanks{margin-top:auto;padding-top:22px;font-family:'Noto Serif KR',serif;font-size:21px;color:var(--ink-2)}
.big .tier .ppl{font-size:26px}
.big .tier .amt{font-size:36px}
/* audit */
.audit{max-width:1040px;font-family:'Noto Serif KR',serif;font-size:27px;line-height:2;color:var(--ink)}
.audit p+p{margin-top:28px}
.sign{margin-top:60px;font-family:'Noto Serif KR',serif;font-size:30px;color:var(--navy);letter-spacing:.3em}
/* chrome */
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px;opacity:0;transition:opacity .25s;z-index:5}
body:hover #bar{opacity:1}
#bar button,#bar a{font:inherit;font-size:13px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:2px;cursor:pointer;text-decoration:none}
#bar span{color:#C9D2E0;font-size:13px;align-self:center;min-width:60px;text-align:center}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#C9D2E0;font-size:16px}
@media print{
  @page{size:1600px 900px;margin:0}
  html,body{overflow:visible;background:#fff}
  #stage{position:static;display:block}
  .deck{transform:none!important;width:1600px;height:auto}
  .slide{position:relative;display:flex!important;width:1600px;height:900px;page-break-after:always;break-after:page}
  #bar,#msg{display:none}
}
</style>
</head>
<body>
<div id="msg">장부를 불러오는 중입니다</div>
<div id="stage"><div class="deck" id="deck"></div></div>
<div id="bar"><button id="prev" aria-label="이전">&#8249; 이전</button><span id="pg"></span><button id="next" aria-label="다음">다음 &#8250;</button><button id="fs">전체 화면</button><button onclick="window.print()">PDF로 저장</button><a href="/admin/finance/">장부로</a></div>
<script>
(async () => {
  const $ = s => document.querySelector(s);
  const W = n => Math.round(n).toLocaleString('ko-KR');
  const P = n => '(' + W(n) + ')';
  const man = n => (n / 10000).toLocaleString('ko-KR');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dot = s => s.replace(/-/g, '.');
  const kdate = s => { const [y, m, d] = s.split('-').map(Number); return `${y}년 ${m}월 ${d}일`; };
  let F, D;
  try {
    const get = u => fetch(u, { credentials: 'same-origin' }).then(r => { if (!r.ok) throw new Error(r.status === 401 ? '로그인이 필요합니다' : r.status === 403 ? '결산 열람 권한이 없습니다' : '불러오기 실패 (' + r.status + ')'); return r.json(); });
    [F, D] = await Promise.all([get('/api/finance'), get('data.json')]);
  } catch (e) { $('#msg').textContent = e.message; return; }

  const nm = e => (e.counterparty || String(e.item || '').replace(/\s*-\s*기부.*$/, '')).trim();
  const E = F.entries.filter(e => !e.planned);
  const inPeriod = e => e.no > D.start_after && e.date <= D.asof;
  const before = e => e.no <= D.start_after;
  const sgn = e => e.type === 'income' ? e.amount : -e.amount;
  const open = D.carry + E.filter(before).reduce((s, e) => s + sgn(e), 0);
  const cur = E.filter(inPeriod);
  const inc = {}, exc = {};
  for (const e of cur) (e.type === 'income' ? inc : exc)[e.category] = ((e.type === 'income' ? inc : exc)[e.category] || 0) + e.amount;
  const TI = Object.values(inc).reduce((a, b) => a + b, 0), TE = Object.values(exc).reduce((a, b) => a + b, 0);
  const close = open + TI - TE;
  // 지출 묶음
  const groups = D.expense_groups.map(g => ({ ...g, amt: g.cats.reduce((s, c) => s + (exc[c] || 0), 0) }));
  const known = new Set(D.expense_groups.flatMap(g => g.cats));
  const other = Object.entries(exc).filter(([c]) => !known.has(c)).reduce((s, [, v]) => s + v, 0);
  if (other) { const g = groups.find(g => g.label === '기타잡비'); if (g) g.amt += other; else groups.push({ label: '기타', amt: other, note: '' }); }
  groups.sort((a, b) => b.amt - a.amt);
  // 기부
  const isDon = e => e.type === 'income' && e.category === '기부금';
  const cum = {}; for (const e of E.filter(e => isDon(e) && e.date <= D.asof)) cum[nm(e)] = (cum[nm(e)] || 0) + e.amount;
  for (const [k, v] of Object.entries(D.adjust || {})) cum[k] = (cum[k] || 0) + v;
  const yr = {}; for (const e of cur.filter(isDon)) yr[nm(e)] = (yr[nm(e)] || 0) + e.amount;
  const CUM = Object.values(cum).reduce((a, b) => a + b, 0), NP = Object.keys(cum).length;
  const YR = Object.values(yr).reduce((a, b) => a + b, 0), NY = Object.keys(yr).length;
  const cumExp = D.carry + CUM - close;
  const coh = n => D.cohorts[n] || '';
  const key = n => { const c = coh(n), m = c.match(/(\d+)/); const g = c.startsWith('경영') ? 0 : c.startsWith('대학원') ? 1 : 2; let y = m ? +m[1] : 999; if (g === 0 && y < 30) y += 100; return [g, y, n]; };
  const cmp = (a, b) => { const x = key(a), y = key(b); return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2], 'ko'); };
  const tiers = obj => { const t = {}; for (const [n, a] of Object.entries(obj)) (t[a] = t[a] || []).push(n); return Object.entries(t).map(([a, ns]) => [+a, ns.sort(cmp)]).sort((a, b) => b[0] - a[0]); };
  const tierHTML = list => list.map(([a, ns]) => `<div class="tier"><div class="amt num">${man(a)}<span class="u">만원</span></div><div class="ppl">${ns.map(n => `<span>${esc(n)}${coh(n) ? `<em>${esc(coh(n))}</em>` : ''}</span>`).join('')}</div></div>`).join('');

  const startDate = cur.length ? cur.map(e => e.date).sort()[0] : D.asof;
  const period = `${dot(startDate)} ~ ${dot(D.asof)}`;
  const foot = `<div class="foot"><span>${esc(D.org)}</span><span>${dot(D.asof)} 기준</span></div>`;
  const incRows = Object.entries(inc).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<tr class="s"><td>${esc(D.income_labels[c] || c)}</td><td class="n"></td><td class="num">${W(v)}</td></tr>`).join('');
  const maxG = Math.max(...groups.map(g => g.amt), 1);
  const ct = tiers(cum), hi = ct.filter(t => t[0] >= 3000000), lo = ct.filter(t => t[0] < 3000000);

  const S = [];
  S.push(`<section class="slide cover"><div class="kicker">Annual Financial Report</div><h1>${esc(D.asof.slice(0, 4))}년 결산 보고</h1><div class="org">${esc(D.org)}</div>
    <div class="meta"><div>결산 기간<b class="num">${period}</b></div><div>기말 잔액<b class="num">${W(close)}원</b></div><div>감사<b>${esc(D.auditor)}</b></div></div></section>`);
  S.push(`<section class="slide"><div class="kicker">Summary</div><h2>결산 요약<small>${dot(D.asof)} 기준</small></h2><div class="rule"></div>
    <div class="kpis">
      <div class="kpi"><div class="l">2021년 이전 이월회비</div><div class="v num">${man(D.carry).split('.')[0]}<span class="u">만원</span></div><div class="s num">${W(D.carry)}원</div></div>
      <div class="kpi"><div class="l">누적 기부금</div><div class="v num">${man(CUM)}<span class="u">만원</span></div><div class="s">총 기부 인원 ${NP}명</div></div>
      <div class="kpi"><div class="l">누적 지출</div><div class="v num">${man(cumExp).split('.')[0]}<span class="u">만원</span></div><div class="s num">${W(cumExp)}원</div></div>
      <div class="kpi"><div class="l">현재 잔액</div><div class="v num">${man(close).split('.')[0]}<span class="u">만원</span></div><div class="s num">${W(close)}원</div></div>
    </div>
    <div class="twocol">
      <div class="block"><h3>이번 결산기 수입<span class="num">${W(TI)}원</span></h3><div class="bars">${Object.entries(inc).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div class="row"><span>${esc(D.income_labels[c] || c)}</span><span class="bar"><i class="g" style="width:${Math.max(1, v / TI * 100)}%"></i></span><span class="a num">${W(v)}</span></div>`).join('')}</div></div>
      <div class="block"><h3>이번 결산기 지출<span class="num">${W(TE)}원</span></h3><div class="bars">${groups.map(g => `<div class="row"><span>${esc(g.label)}</span><span class="bar"><i style="width:${Math.max(1, g.amt / maxG * 100)}%"></i></span><span class="a num">${W(g.amt)}</span></div>`).join('')}</div></div>
    </div>${foot}</section>`);
  S.push(`<section class="slide"><div class="kicker">Statement of Receipts and Payments</div><h2>수입 및 지출 결산서<small>${period}</small></h2><div class="rule"></div>
    <table class="stmt">
      <tr class="h"><td>${esc(D.prev_close_label)} 잔고</td><td class="n"></td><td class="num">${W(open)}</td></tr>
      <tr class="h"><td>수입</td><td class="n"></td><td class="num">${W(TI)}</td></tr>${incRows}
      <tr class="h"><td>지출</td><td class="n"></td><td class="num neg">${P(TE)}</td></tr>
      ${groups.map(g => `<tr class="s"><td>${esc(g.label)}</td><td class="n">${esc(g.note || '')}</td><td class="num neg">${P(g.amt)}</td></tr>`).join('')}
      <tr class="end"><td>${esc(kdate(D.asof))} 잔고</td><td class="n">단위: 원</td><td class="num">${W(close)}</td></tr>
    </table>${foot}</section>`);
  S.push(`<section class="slide"><div class="kicker">With Gratitude</div><h2>지난 1년간 기부해 주신 분<small>${NY}명 · ${W(YR)}원</small></h2><div class="rule"></div>
    <div class="tiers big">${tierHTML(tiers(yr))}</div><div class="thanks">${period} 사이에 보내 주신 마음에 깊이 감사드립니다.</div>${foot}</section>`);
  S.push(`<section class="slide"><div class="kicker">Honor Roll</div><h2>누적 기부금 ${W(CUM)}원<small>총 ${NP}명 · 300만원 이상</small></h2><div class="rule"></div>
    <div class="tiers">${tierHTML(hi)}</div>${foot}</section>`);
  S.push(`<section class="slide"><div class="kicker">Honor Roll</div><h2>누적 기부금 ${W(CUM)}원<small>총 ${NP}명 · 200만원 이하</small></h2><div class="rule" style="margin-bottom:24px"></div>
    <div class="tiers dense">${tierHTML(lo)}</div>${foot}</section>`);
  S.push(`<section class="slide"><div class="kicker">Audit Opinion</div><h2>감사 의견</h2><div class="rule"></div>
    <div class="audit"><p>본인은 ${esc(D.org)}의 ${esc(kdate(startDate))}부터 ${esc(kdate(D.asof))}까지 수입 및 지출 사항을 감사하였습니다.</p>
    <p>본인의 의견으로는 본 동창회의 수입 및 지출은 정당하고 적정하게 집행 관리되었으며, 수입 및 지출 보고서는 적정하게 표시되어 있습니다.</p></div>
    <div class="sign">감사 ${esc(D.auditor)}</div>${foot}</section>`);

  const deck = $('#deck'); deck.innerHTML = S.join(''); $('#msg').remove();
  const slides = [...deck.children]; let i = Math.min(slides.length - 1, Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  const show = () => { slides.forEach((s, k) => s.classList.toggle('on', k === i)); $('#pg').textContent = `${i + 1} / ${slides.length}`; history.replaceState(null, '', '#' + (i + 1)); };
  const fit = () => { const s = Math.min(innerWidth / 1600, innerHeight / 900); deck.style.transform = `scale(${s})`; };
  const go = d => { i = Math.min(slides.length - 1, Math.max(0, i + d)); show(); };
  addEventListener('resize', fit); fit(); show();
  addEventListener('keydown', e => { if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(1); } else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(-1); } else if (e.key === 'Home') { i = 0; show(); } else if (e.key === 'End') { i = slides.length - 1; show(); } else if (e.key === 'f') document.documentElement.requestFullscreen?.(); });
  $('#stage').addEventListener('click', e => go(e.clientX < innerWidth / 3 ? -1 : 1));
  $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
  $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
})();
</script>
</body>
</html>
