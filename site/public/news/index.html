<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>소식 | 서울대학교 경영대학 총동문회</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="/assets/js/i18n.js?v=20260909e"></script>
<link rel="stylesheet" href="/assets/css/main.css?v=20260909e"><link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
.detail{background:var(--paper);border:1px solid var(--line);padding:36px 40px;margin-top:24px;display:none}
.detail.show{display:block}
.detail h3{font-size:24px;margin-bottom:8px}
.detail .d{font-size:13px;color:var(--ink-3);font-family:var(--display);letter-spacing:.06em;margin-bottom:22px}
.detail .b{white-space:pre-wrap;color:var(--ink-2);line-height:1.9}
</style>
</head>
<body>
<div id="site-header"></div>
<section class="page-hero"><div class="container">
  <div class="crumbs"><a href="/">홈</a><span>/</span><span>소식</span></div>
  <span class="eyebrow">News</span><h1>소식</h1>
  <p class="lede">공지사항과 동문회 소식, 동문 경조사와 언론 속 동문 이야기를 전합니다.</p>
</div></section>
<nav class="subnav"><div class="container"><ul>
  <li><a href="#notice" data-default>공지사항</a></li><li><a href="#news">동문회 소식</a></li><li><a href="#family">동문 경조사</a></li><li><a href="#press">언론 속 동문</a></li>
</ul></div></nav>
<section class="section"><div class="container"><div class="layout">
  <div>
    <div class="section-head" style="margin-bottom:24px"><div><span class="eyebrow" id="sec-eyebrow">Notice</span><h2 id="sec-title">공지사항</h2></div>
      <div class="field" style="margin:0;min-width:240px"><label class="sr-only" for="q">검색</label><input id="q" placeholder="제목 검색"></div></div>
    <ul class="notice-list" id="list"></ul>
    <div class="detail" id="detail"></div>
  </div>
  <aside class="aside"><div class="box"><h4>Categories</h4><ul>
    <li><a href="#notice">공지사항</a></li><li><a href="#news">동문회 소식</a></li><li><a href="#family">동문 경조사</a></li><li><a href="#press">언론 속 동문</a></li></ul></div>
    <div class="box mt-3"><h4>Submit</h4><p style="font-size:14px;color:var(--ink-2);margin:0 0 12px">경조사·소식 제보는 사무국으로 보내주세요.</p><a class="btn sm ghost" href="mailto:alumni@snubusiness.com">alumni@snubusiness.com</a></div>
  </aside>
</div></div></section>
<div id="site-footer"></div>
<script src="/assets/js/site.js?v=20260909e"></script>
<script>
(async () => {
  const { json, fmtDate, esc, t } = SNU;
  const META = { notice:['Notice','공지사항'], news:['Alumni News','동문회 소식'], family:['Family','동문 경조사'], press:['Press','언론 속 동문'] };
  const data = (await json('/data/notices.json')).items;
  const list = document.getElementById('list'), det = document.getElementById('detail'), q = document.getElementById('q');
  function render() {
    const type = (location.hash || '#notice').slice(1).split('/')[0];
    const m = META[type] || META.notice;
    document.getElementById('sec-eyebrow').textContent = m[0]; document.getElementById('sec-title').textContent = m[1];
    const kw = q.value.trim();
    const rows = data.filter(i => i.type === type && (!kw || t(i,'title').toLowerCase().includes(kw.toLowerCase()))).sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || b.date.localeCompare(a.date));
    list.innerHTML = rows.length ? rows.map(i => `<li><a href="#${type}/${i.id}"><span class="cat">${esc(t(i,'cat'))}</span><span class="title">${i.pinned?'<span class="badge" style="margin-right:8px">고정</span>':''}${esc(t(i,'title'))}</span><span class="date">${fmtDate(i.date)}</span></a></li>`).join('') : '<li style="padding:32px;text-align:center;color:var(--ink-3)">등록된 글이 없습니다.</li>';
    const id = (location.hash.split('/')[1]);
    const it = id && data.find(x => String(x.id) === id);
    det.classList.toggle('show', !!it);
    if (it) { det.innerHTML = `<span class="tag" style="color:var(--gold-500);font-family:var(--display);letter-spacing:.16em;font-weight:700;font-size:12px">${esc(t(it,'cat'))}</span><h3>${esc(t(it,'title'))}</h3><div class="d">${fmtDate(it.date)} · ${SNU.lang==='en'?'Office':'사무국'}</div><div class="b">${esc(t(it,'body') || (SNU.lang==='en'?'Details coming soon.':'상세 내용은 준비 중입니다.'))}</div>`; det.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  }
  window.addEventListener('hashchange', render); q.addEventListener('input', render); render();
})();
</script>
</body></html>
