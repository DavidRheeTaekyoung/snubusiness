<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>의견 조사 | 서울대학교 경영대학 총동문회</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css?v=20261020c"><link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
body{background:var(--ivory);margin:0}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}
.top{text-align:center;padding:10px 0 20px;border-bottom:2px solid var(--navy-800);margin-bottom:22px}
.top .seal{width:52px;height:52px;color:var(--navy-800);margin:0 auto 10px}
.top .org{font-size:13px;color:var(--ink-3);letter-spacing:.04em}
.top h1{font-family:var(--serif);font-size:clamp(20px,4.6vw,26px);color:var(--navy-900);margin:6px 0 0;line-height:1.4}
.intro{font-size:14px;color:var(--ink-2);background:var(--paper);border-left:3px solid var(--gold-400);padding:12px 14px;line-height:1.7;margin-bottom:22px}
.cand{background:var(--paper);border:1px solid var(--line);padding:16px 18px;margin-bottom:12px}
.cand .hd{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.cand .no{font-family:var(--display);font-size:22px;color:var(--gold-500);min-width:30px}
.cand .nm{font-size:19px;font-weight:700;color:var(--navy-900)}
.cand .ln{font-size:13px;color:var(--ink-3);margin:4px 0 10px;line-height:1.6}
.cand dl{margin:0;display:grid;grid-template-columns:76px 1fr;gap:6px 12px;font-size:14px;line-height:1.7}
.cand dt{color:var(--navy-800);font-weight:600;font-size:13px;padding-top:1px}.cand dd{margin:0;color:var(--ink-2)}
.cand dd.topic{color:var(--navy-900);font-weight:600}
.cand dd a{color:var(--navy-800);margin-right:12px;white-space:nowrap}
@media (max-width:520px){.cand dl{grid-template-columns:1fr}.cand dt{padding-top:6px}}
.pair{background:#F4F1EA;border:1px solid var(--line);padding:14px 18px;margin:20px 0 28px;font-size:14px;line-height:1.7}
.pair b{color:var(--navy-900)}
h2.sec{font-family:var(--serif);font-size:19px;color:var(--navy-800);margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.form{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--gold-400);padding:18px}
.q{margin-bottom:22px}.q>label,.q .ql{display:block;font-weight:600;color:var(--navy-900);margin-bottom:8px;font-size:15px}
.q .req{color:var(--danger);font-size:12px;margin-left:4px}
.q input[type=text],.q textarea{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line-2);background:#fff;box-sizing:border-box}
.q textarea{min-height:110px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opts label{display:flex;gap:8px;align-items:center;border:1px solid var(--line-2);background:#fff;padding:10px 12px;cursor:pointer;font-size:14.5px;line-height:1.4}
.opts label:has(input:checked){border-color:var(--navy-800);background:#EEF2F8}
.opts label.off{opacity:.4}
.opts input{accent-color:var(--navy-800);margin:0}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:520px){.who{grid-template-columns:1fr}}
.btn.wide{width:100%;justify-content:center;padding:15px;font-size:16px}
.err{color:var(--danger);font-size:14px;text-align:center;margin-top:12px;min-height:20px}
.ok{background:#E3F1EA;color:var(--success);padding:16px;text-align:center;line-height:1.7;margin-top:14px;font-size:15px}
.foot{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin-top:18px}
.closed{background:#F8E3E0;color:var(--danger);padding:12px;text-align:center;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="top"><div class="seal" data-seal></div><div class="org">서울대학교 경영대학 총동문회</div><h1>불러오는 중…</h1></div></div>
<script src="/assets/js/site.js?v=20261116b"></script>
<script>
(async () => {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const id = new URLSearchParams(location.search).get('id') || 'keynote', app = document.getElementById('app');
  const r = await fetch('/api/poll?id=' + encodeURIComponent(id), { cache: 'no-store' }); const P = await r.json().catch(() => ({}));
  if (!r.ok) { app.querySelector('h1').textContent = P.error || '투표를 열 수 없습니다'; return; }
  const B = P.body || {}, C = B.candidates || [], Q = B.questions || [], M = P.mine || {}, me = P.me || {};
  document.title = P.title + ' | 서울대학교 경영대학 총동문회';
  const nm = no => (C.find(c => c.no === no) || {}).name || no;
  const qHtml = q => q.type === 'text' ? `<div class="q"><label class="ql" for="${q.id}">${esc(q.label)} <span style="font-weight:400;font-size:13px;color:var(--ink-3)">(선택)</span></label><textarea id="${q.id}" name="${q.id}" placeholder="${esc(q.placeholder || '')}">${esc(M[q.id] || '')}</textarea></div>`
    : q.type === 'multi'
    ? `<div class="q"><span class="ql">${esc(q.label)}</span><div class="opts" data-multi="${q.id}">${C.map(c => `<label><input type="checkbox" name="${q.id}" value="${esc(c.no)}" ${(M[q.id] || []).includes(c.no) ? 'checked' : ''}> ${esc(c.no)} ${esc(c.name)}</label>`).join('')}</div><div class="tiny" id="cnt-${q.id}" style="margin-top:6px;font-size:13px;color:var(--ink-3)"></div></div>`
    : `<div class="q"><span class="ql">${esc(q.label)}</span><div class="opts">${(q.options || []).map(o => `<label><input type="radio" name="${q.id}" value="${esc(o)}" ${M[q.id] === o ? 'checked' : ''}> ${esc(o)}</label>`).join('')}</div></div>`;
  const vote = !me.group ? `<div class="closed" style="background:#EEF0F3;color:var(--ink-2)">이 투표는 준비위원·학번대표만 참여할 수 있습니다. 후보 소개는 보실 수 있습니다.</div>`
    : `<form class="form" id="f"><div style="font-size:14px;color:var(--ink-2);margin-bottom:16px"><b>${esc(me.name)}</b> 님 (${esc(me.group)})${P.mine ? ' · 이미 투표하셨습니다. 다시 내시면 앞의 투표가 바뀝니다.' : ''}</div>
      ${Q.map(qHtml).join('')}
      ${B.note ? `<div class="intro" style="margin:0 0 16px">${esc(B.note)}</div>` : ''}
      <button class="btn wide" type="submit" ${P.open ? '' : 'disabled'}>${P.mine ? '투표 바꾸기' : '투표하기'}</button>
      <div class="err" id="err"></div><div id="done"></div></form>`;
  app.innerHTML = `<div class="top"><div class="seal" data-seal></div><div class="org">서울대학교 경영대학 총동문회</div><h1>${esc(P.title)}</h1>${B.subtitle ? `<div class="org" style="margin-top:6px">${esc(B.subtitle)}</div>` : ''}</div>
    ${P.open ? '' : '<div class="closed">투표를 마감했습니다.</div>'}
    ${B.intro ? `<div class="intro">${esc(B.intro)}</div>` : ''}
    ${C.map(c => `<div class="cand"><div class="hd"><span class="no">${esc(c.no)}</span><span class="nm">${esc(c.name)}</span></div><div class="ln">${esc(c.line)}</div><dl>
      ${c.intro ? `<dt>인물 소개</dt><dd>${esc(c.intro)}</dd>` : ''}${c.why ? `<dt>추천 이유</dt><dd>${esc(c.why)}</dd>` : ''}${c.topic ? `<dt>제안 화두</dt><dd class="topic">${esc(c.topic)}</dd>` : ''}
      ${(c.links || []).length ? `<dt>참고자료</dt><dd>${c.links.map(l => `<a href="${esc(l.u)}" target="_blank" rel="noopener noreferrer">${esc(l.t)}</a>`).join('')}</dd>` : ''}</dl></div>`).join('')}
    ${(B.pairs || []).map(p => `<div class="pair"><div style="font-size:12.5px;color:var(--ink-3);margin-bottom:4px">공동 강연·대담 구성 예시</div><b>${esc(p.title)}</b><br>${esc(p.desc)}</div>`).join('')}
    <h2 class="sec">투표</h2>${vote}
    ${B.note ? `<div class="foot">${esc(B.note)}</div>` : ''}`;
  document.querySelectorAll('[data-seal]').forEach(el => { if (SNU.SEAL) el.innerHTML = SNU.SEAL; });
  const f = document.getElementById('f'); if (!f) return;
  // 복수 선택: 최대 개수에 닿으면 나머지를 잠근다
  const sync = () => { for (const q of Q.filter(q => q.type === 'multi')) { const box = f.querySelectorAll(`input[name="${q.id}"]`), n = [...box].filter(i => i.checked).length;
    box.forEach(i => { const off = !i.checked && n >= (q.max || 3); i.disabled = off; i.closest('label').classList.toggle('off', off); });
    document.getElementById('cnt-' + q.id).textContent = `${n}명 선택 (${q.min || 1}~${q.max || 3}명)`; } };
  f.addEventListener('change', sync); sync();
  f.addEventListener('submit', async e => { e.preventDefault(); const err = document.getElementById('err'), done = document.getElementById('done'); err.textContent = ''; done.innerHTML = '';
    const answers = {}; for (const q of Q) answers[q.id] = q.type === 'text' ? f.querySelector('#' + q.id).value.trim() : q.type === 'multi' ? [...f.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i => i.value) : (f.querySelector(`input[name="${q.id}"]:checked`)?.value || '');
    for (const q of Q) { if (q.type === 'multi' && (answers[q.id].length < (q.min || 1))) { err.textContent = '초청하고 싶은 연사를 1명 이상 골라 주세요'; return; } if (q.type === 'choice' && q.required && !answers[q.id]) { err.textContent = q.label.split('.')[0] + ' 문항을 골라 주세요'; return; } }
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    const r = await fetch('/api/poll', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, answers }) }); const j = await r.json().catch(() => ({})); btn.disabled = false;
    if (!r.ok) { err.textContent = j.error || '보내지 못했습니다. 잠시 후 다시 시도해 주세요'; return; }
    const q1 = Q.find(q => q.type === 'multi');
    done.innerHTML = `<div class="ok">${j.updated ? '투표를 바꿨습니다.' : '투표했습니다. 감사합니다.'}${q1 ? `<br><span style="font-size:13px">고른 연사: ${answers[q1.id].map(nm).map(esc).join(', ')}</span>` : ''}<br><span style="font-size:13px">마감 전까지 이 페이지에서 바꿀 수 있습니다.</span></div>`;
    btn.textContent = '투표 바꾸기'; });
})();
</script>
</body></html>
