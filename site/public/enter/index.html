<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입장 | 서울대학교 경영대학 총동문회</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css?v=20260915c"><link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
body{background:var(--navy-900);min-height:100vh;display:grid;place-items:center;padding:20px}
.gate{width:100%;max-width:520px;background:var(--paper);padding:clamp(28px,5vw,48px);border-top:3px solid var(--gold-400);box-shadow:var(--shadow-2);position:relative;overflow:hidden}
.gate .seal{width:64px;height:64px;color:var(--navy-800);margin:0 auto 18px}
.gate h1{font-size:22px;text-align:center;font-weight:600}
.gate .sub{text-align:center;font-size:13.5px;color:var(--ink-3);margin:8px 0 26px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:18px}
.names button{font:inherit;font-size:15px;padding:11px 4px;border:1px solid var(--line-2);background:var(--ivory);color:var(--navy-800);cursor:pointer;border-radius:2px;transition:all .2s}
.names button:hover{border-color:var(--gold-400)}
.names button.on{background:var(--navy-800);color:var(--paper);border-color:var(--navy-800)}
.code input{font-family:var(--mono);font-size:22px;letter-spacing:.2em;text-align:center;text-transform:uppercase;padding:14px;width:100%;border:1px solid var(--line-2);border-radius:2px}
.code input:focus{outline:0;border-color:var(--navy-800);box-shadow:0 0 0 3px rgba(92,20,36,.1)}
.gate .btn{width:100%;justify-content:center;margin-top:14px;padding:15px}
.err{color:var(--danger);font-size:13.5px;text-align:center;margin-top:12px;min-height:20px}
.help{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:18px;line-height:1.7}
.wm{position:absolute;right:-60px;bottom:-60px;width:220px;opacity:.06;color:var(--navy-800)}
</style>
</head>
<body>
<form class="gate" id="gate" autocomplete="off">
  <div class="seal" data-seal></div>
  <h1>서울대학교 경영대학 총동문회</h1>
  <div class="sub">준비위원회 전용 공간입니다. 본인 이름을 고르고 받으신 입장코드를 입력해 주세요.</div>
  <div class="names" id="names"></div>
  <div class="code"><input id="code" placeholder="입장코드" inputmode="latin" maxlength="12" aria-label="입장코드"></div>
  <button class="btn gold" type="submit">입장</button>
  <div class="err" id="err"></div>
  <div class="help">입장코드는 준비위원회 단톡방 공지에 있습니다. · 한 번 입장하면 이 기기에서 90일간 유지됩니다.</div>
  <div class="wm" data-seal></div>
</form>
<script src="/assets/js/site.js?v=20260915c"></script>
<script>
(async () => {
  const roster = (await fetch('/data/committee.json').then(r => r.json())).members;
  const box = document.getElementById('names'); let picked = '';
  box.innerHTML = roster.map(n => `<button type="button" data-n="${n}">${n}</button>`).join('');
  box.addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (!b) return; picked = b.dataset.n; [...box.children].forEach(x => x.classList.toggle('on', x === b)); document.getElementById('code').focus(); });
  const form = document.getElementById('gate');
  // Enter 키: 코드 입력칸이든 이름 버튼 위든 어디서나 제출
  form.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener('submit', async e => {
    e.preventDefault(); const err = document.getElementById('err'); err.textContent = '';
    if (!picked) { err.textContent = '이름을 먼저 골라 주세요'; return; }
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: picked, code: document.getElementById('code').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { err.textContent = j.error || '입장할 수 없습니다'; document.getElementById('code').select(); return; }
    const next = new URLSearchParams(location.search).get('next') || '/';
    location.href = next.startsWith('/') ? next : '/';
  });
})();
</script>
</body></html>
