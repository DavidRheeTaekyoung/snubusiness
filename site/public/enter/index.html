<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입장 | 서울대학교 경영대학 총동문회</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css?v=20260915e"><link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
body{background:var(--navy-900);min-height:100vh;display:grid;place-items:center;padding:20px}
.gate{width:100%;max-width:520px;background:var(--paper);padding:clamp(28px,5vw,44px);border-top:3px solid var(--gold-400);box-shadow:var(--shadow-2);position:relative;overflow:hidden}
.gate .seal{width:60px;height:60px;color:var(--navy-800);margin:0 auto 16px}
.gate h1{font-size:21px;text-align:center;font-weight:600}
.gate .sub{text-align:center;font-size:13.5px;color:var(--ink-3);margin:8px 0 22px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{flex:1;font:inherit;font-size:15px;padding:12px;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--navy-800);border-color:var(--gold-500);font-weight:600}
.pane{display:none}.pane.on{display:block}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px;margin:6px 0 16px}
.names button{font:inherit;font-size:14.5px;padding:10px 4px;border:1px solid var(--line-2);background:var(--ivory);color:var(--navy-800);cursor:pointer;border-radius:2px;transition:all .2s}
.names button:hover{border-color:var(--gold-400)}
.names button.on{background:var(--navy-800);color:var(--paper);border-color:var(--navy-800)}
.field{margin-bottom:12px}
.field input{padding:13px 14px;font-size:15.5px}
.gate .btn{width:100%;justify-content:center;margin-top:6px;padding:15px}
.err{color:var(--danger);font-size:13.5px;text-align:center;margin-top:12px;min-height:20px}
.help{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:16px;line-height:1.7}
.wm{position:absolute;right:-60px;bottom:-60px;width:220px;opacity:.06;color:var(--navy-800)}
.hint{font-size:12.5px;color:var(--ink-3);margin:-4px 0 12px}
.field .chk{font-size:12.5px;margin-top:5px;min-height:16px}
.field .chk.bad{color:var(--danger)}.field .chk.good{color:var(--success)}
.field input.bad{border-color:var(--danger)}.field input.good{border-color:var(--success)}
</style>
</head>
<body>
<div class="gate">
  <div class="seal" data-seal></div>
  <h1>서울대학교 경영대학 총동문회</h1>
  <div class="sub">준비위원회 전용 공간입니다.</div>
  <div class="tabs"><button type="button" class="on" data-tab="login">로그인</button><button type="button" data-tab="signup">회원가입 (처음 오신 분)</button></div>

  <form class="pane on" id="login" autocomplete="on">
    <div class="field"><label for="l-email">이메일 아이디</label><input id="l-email" type="email" autocomplete="username" placeholder="name@example.com" required></div>
    <div class="field"><label for="l-pw">비밀번호</label><input id="l-pw" type="password" autocomplete="current-password" required></div>
    <button class="btn gold" type="submit">로그인</button>
    <div class="err" id="l-err"></div>
    <div class="help">비밀번호를 잊으셨으면 이태경 위원에게 임시 비밀번호를 요청해 주세요.<br>한 번 로그인하면 이 기기에서 90일간 유지됩니다.</div>
  </form>

  <form class="pane" id="signup" autocomplete="on">
    <label>본인 이름 선택</label>
    <div class="hint">준비위원 명단에 있는 이름만 가입할 수 있습니다.</div>
    <div class="names" id="names"></div>
    <div class="field"><label for="s-email">이메일 아이디</label><input id="s-email" type="email" autocomplete="email" placeholder="name@example.com" required></div>
    <div class="field"><label for="s-pw">비밀번호 (8자 이상)</label><input id="s-pw" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="field"><label for="s-pw2">비밀번호 확인</label><input id="s-pw2" type="password" autocomplete="new-password" minlength="8" required><div class="chk" id="pw-chk"></div></div>
    <button class="btn" type="submit">가입하고 입장</button>
    <div class="err" id="s-err"></div>
    <div class="help">비밀번호는 본인만 알며, 서버에는 암호화(해시)된 형태로만 저장됩니다.</div>
  </form>
  <div class="wm" data-seal></div>
</div>
<script src="/assets/js/site.js?v=20260915e"></script>
<script>
(async () => {
  const q = s => document.querySelector(s);
  const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/'; return n.startsWith('/') ? n : '/'; })();
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === b.dataset.tab)); }));
  if (new URLSearchParams(location.search).get('tab') === 'signup') q('[data-tab="signup"]').click();
  const roster = (await fetch('/data/committee.json').then(r => r.json())).members;
  let picked = ''; const box = q('#names');
  box.innerHTML = roster.map(n => `<button type="button" data-n="${n}">${n}</button>`).join('');
  box.addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (!b) return; picked = b.dataset.n; [...box.children].forEach(x => x.classList.toggle('on', x === b)); q('#s-email').focus(); });
  // 비밀번호 확인: 입력 즉시 일치 여부 표시
  const pwChk = () => { const a = q('#s-pw').value, b = q('#s-pw2').value, el = q('#pw-chk'), i2 = q('#s-pw2');
    if (!b) { el.textContent = ''; el.className = 'chk'; i2.className = ''; return; }
    if (a.length < 8) { el.textContent = '비밀번호는 8자 이상이어야 합니다'; el.className = 'chk bad'; i2.className = 'bad'; return; }
    const same = a === b; el.textContent = same ? '비밀번호가 일치합니다' : '비밀번호가 서로 다릅니다'; el.className = 'chk ' + (same ? 'good' : 'bad'); i2.className = same ? 'good' : 'bad'; };
  q('#s-pw').addEventListener('input', pwChk); q('#s-pw2').addEventListener('input', pwChk);
  async function post(url, body) { const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({})); return { ok: r.ok, j }; }
  q('#login').addEventListener('submit', async e => { e.preventDefault(); const err = q('#l-err'); err.textContent = '';
    const { ok, j } = await post('/api/login', { email: q('#l-email').value.trim(), password: q('#l-pw').value });
    if (!ok) { err.textContent = j.error || '로그인할 수 없습니다'; q('#l-pw').select(); return; } location.href = next; });
  q('#signup').addEventListener('submit', async e => { e.preventDefault(); const err = q('#s-err'); err.textContent = '';
    if (!picked) { err.textContent = '본인 이름을 먼저 골라 주세요'; return; }
    if (q('#s-pw').value !== q('#s-pw2').value) { err.textContent = '비밀번호 확인이 일치하지 않습니다'; q('#s-pw2').select(); return; }
    const { ok, j } = await post('/api/signup', { name: picked, email: q('#s-email').value.trim(), password: q('#s-pw').value });
    if (!ok) { err.textContent = j.error || '가입할 수 없습니다'; return; } location.href = next; });
})();
</script>
</body></html>
