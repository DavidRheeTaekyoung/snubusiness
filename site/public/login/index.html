<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 | 서울대학교 경영대학 총동문회</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css?v=20260904f"><link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
.auth{min-height:calc(100vh - 120px);display:grid;grid-template-columns:1fr 1fr}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth .left{display:none}}
.auth .left{background:var(--navy-900);color:var(--paper);padding:80px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.auth .left .seal{position:absolute;right:-20%;top:-10%;width:80%;opacity:.07;color:#DCC392}
.auth .right{display:grid;place-items:center;padding:60px var(--gutter)}
.auth form{width:100%;max-width:420px}
.notice{background:var(--gold-100);border:1px solid var(--gold-300);padding:14px 18px;font-size:13.5px;color:var(--ink-2);margin-bottom:24px}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="auth">
  <div class="left"><div class="seal" data-seal></div>
    <span class="eyebrow">Members Only</span>
    <h2 style="color:#fff;max-width:14ch">동문만을 위한<br>공간에 오신 것을 환영합니다</h2>
    <p style="color:rgba(247,244,238,.7);max-width:420px;margin-top:20px">동문 찾기, 행사 신청, 회비 납부, 마이페이지는 본인 인증을 거친 동문에게 제공됩니다.</p></div>
  <div class="right">
    <form onsubmit="event.preventDefault();alert('회원 인증 시스템은 준비 중입니다. 사무국(alumni@snubusiness.com)으로 문의해 주세요.')">
      <span class="eyebrow">Sign in</span><h2 class="mb-4">로그인</h2>
      <div class="notice">회원 시스템 오픈 준비 중입니다. 오픈 시 졸업생 명부와 대조하여 본인 인증 후 계정을 발급합니다.</div>
      <div class="field"><label for="id">이메일</label><input id="id" type="email" placeholder="name@example.com" autocomplete="username"></div>
      <div class="field"><label for="pw">비밀번호</label><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn" style="width:100%;justify-content:center">로그인</button>
      <div style="display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-3);margin-top:18px"><a href="#">동문 인증 · 가입 신청</a><a href="#">비밀번호 찾기</a></div>
    </form>
  </div>
</div>
<div id="site-footer"></div>
<script src="/assets/js/site.js?v=20260904f"></script>
</body></html>
